version: "3.9"

services:
  postgres:
    image: postgres:17.5
    container_name: bp_postgres
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: bp_user
      POSTGRES_PASSWORD: bp_pass
      POSTGRES_DB: bp_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bp_user -d bp_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bp_redis
    restart: always
    ports:
      - "6379:6379"

  # One-shot: run all schema migrations before the API starts.
  migrations:
    build: .
    container_name: bp_migrations
    command: ["python", "-m", "migrations.run_all"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://bp_user:bp_pass@postgres:5432/bp_db
    restart: "no"

  fastapi:
    build: .
    container_name: bp_fastapi
    ports:
      - "8888:80"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://bp_user:bp_pass@postgres:5432/bp_db
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "true"
      BOT_MODE: "disabled"

  bot:
    build: .
    container_name: bp_bot
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://bp_user:bp_pass@postgres:5432/bp_db
      REDIS_URL: redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is baked at build time and used by the BROWSER —
        # it must be the host-reachable URL, not a compose-internal hostname.
        NEXT_PUBLIC_API_URL: http://localhost:8888/api/v1
    container_name: bp_frontend
    ports:
      - "3000:3000"
    depends_on:
      - fastapi

volumes:
  pgdata:
